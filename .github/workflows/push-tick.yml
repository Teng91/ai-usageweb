name: push-tick

# 沒人開網頁時機器會 suspend、輪詢也停了；每 15 分鐘叫醒一次，抓一輪並判斷要不要推播。
# 這是備援：GitHub 的排程常延遲好幾小時、尖峰會整次跳過，主要的喚醒由 Google Apps Script（google_apps_script/Code.gs）負責。
# 兩邊同時打不會重複推播（伺服器會去重，也有每家最短抓取間隔）。
# 需要 repo secret PUSH_TICK_TOKEN（npm run gen-vapid 產生，跟 fly secrets 的同一個值）。
# 網址不是預設的話，設 repo variable APP_URL。
on:
  schedule:
    - cron: '*/15 * * * *'
    - cron: '7 0 * * *' # 每天一次：續命＋照常叫醒
  workflow_dispatch:

# 預設不給 GITHUB_TOKEN 任何權限；只有續命那個 job 拿 actions: write
permissions: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: 叫醒伺服器
        env:
          TOKEN: ${{ secrets.PUSH_TICK_TOKEN }}
          APP_URL: ${{ vars.APP_URL || 'https://ai-usageweb.fly.dev' }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "PUSH_TICK_TOKEN 還沒設定，略過"
            exit 0
          fi
          curl -fsS --max-time 90 --retry 2 --retry-delay 10 -X POST \
            -H "Authorization: Bearer $TOKEN" "$APP_URL/api/push/tick"

  # 公開 repo 連續 60 天沒有 commit，GitHub 會自動停用排程；每天呼叫一次 enable API 重設計時，不必產生假 commit。
  # 獨立成一個 job：只有它有 actions: write，而且碰不到 PUSH_TICK_TOKEN；失敗只發 warning，不影響叫醒。
  keep-schedule-enabled:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '7 0 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: 排程續命
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/push-tick.yml/enable" > /dev/null \
            && echo "已重新啟用排程" || echo "::warning::重新啟用排程失敗"
