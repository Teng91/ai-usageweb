<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AI 用量</title>
  <meta name="description" content="Claude、Codex、Antigravity、Copilot 額度與 OpenRouter 餘額">
  <meta name="theme-color" content="#070b16" id="theme-color">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AI 用量">
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/skin-adventure.css">
</head>
<body>
  <!-- 冒險風格的像素場景（scene.js 建立三張地圖、勇者與傳送點）；簡約風格時隱藏 -->
  <div class="scene" id="scene" aria-hidden="true"></div>
  <button class="bg-exit" id="bg-exit" type="button" hidden>顯示用量</button>

  <header class="topbar">
    <h1>AI 用量</h1>
    <div class="conn" id="conn" aria-live="polite">
      <span class="dot" id="conn-dot" aria-hidden="true"></span>
      <span id="conn-text">連線中…</span>
    </div>
    <button class="bg-btn" id="bg-btn" type="button" data-key="B" title="只看風景（B）" aria-label="只看風景">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M3 19l6-9 4 6 3-4 5 7z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="17" cy="6" r="2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
    </button>
    <button class="skin-btn" id="skin-btn" type="button" data-key="S">
      <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M5 21V4m0 0h11l-2 4 2 4H5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span id="skin-label">冒險風</span>
    </button>
    <button class="theme-btn" id="theme-btn" type="button" data-key="T" aria-label="切換亮色／暗色" title="切換亮色／暗色">
      <svg class="icon-sun" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
    </button>
    <button class="install" id="install-btn" type="button" hidden>安裝</button>
  </header>

  <div class="banner" id="update-banner" hidden>
    <span>有新版本</span>
    <button type="button" id="update-btn">點此重新載入</button>
  </div>
  <div class="progress" id="progress" aria-hidden="true"></div>

  <div class="banner" id="ios-banner" hidden>
    <span>想像 App 一樣使用：按瀏覽器的「分享」<svg class="share-icon" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M12 3v12M8 7l4-4 4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 11v8a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>，再選「加入主畫面」</span>
    <button type="button" id="ios-banner-close">知道了</button>
  </div>
  <div class="banner warn" id="offline-banner" hidden>離線：顯示的是上次的數字</div>

  <main id="cards" class="cards" aria-live="polite">
    <div class="loading" id="empty" role="status">
      <div class="sk-card" aria-hidden="true"><span class="sk sk-title"></span><span class="sk sk-line"></span><span class="sk sk-bar"></span><span class="sk sk-line short"></span></div>
      <div class="sk-card" aria-hidden="true"><span class="sk sk-title"></span><span class="sk sk-line"></span><span class="sk sk-bar"></span><span class="sk sk-line short"></span></div>
      <div class="sk-card" aria-hidden="true"><span class="sk sk-title"></span><span class="sk sk-line"></span><span class="sk sk-bar"></span><span class="sk sk-line short"></span></div>
      <div class="sk-card" aria-hidden="true"><span class="sk sk-title"></span><span class="sk sk-line"></span><span class="sk sk-bar"></span><span class="sk sk-line short"></span></div>
      <p class="loading-text">正在喚醒伺服器，通常幾秒內完成…</p>
    </div>
  </main>

  <footer class="foot">
    <span id="last-updated">—</span>
  </footer>

  <!-- 冒險風格的經驗值條：Claude 每週已用量換算成等級 -->
  <div class="expbar" id="expbar" hidden>
    <span class="exp-lv" id="exp-lv">Lv.1</span>
    <span class="exp-track"><span class="exp-fill" id="exp-fill"></span></span>
    <span class="exp-text" id="exp-text"></span>
  </div>

  <template id="card-tpl">
    <article class="card">
      <header class="card-head">
        <h2 class="card-name"></h2>
        <span class="plan"></span>
        <span class="plan-exp"></span>
      </header>
      <div class="card-body"></div>
      <p class="card-status"></p>
      <p class="card-meta"></p>
    </article>
  </template>

  <script src="/app.js" type="module"></script>
  <script src="/scene.js" type="module"></script>
</body>
</html>
